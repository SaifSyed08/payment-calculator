<div id="payment-widget"></div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treatment Payment Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <style>
    .custom-treatments-payment-calculator {
      border-top: 1px solid #ccc;
      margin: 30px 0;
      padding: 20px;
      font-family: "Outfit", sans-serif;
    }

    .custom-treatments-payment-calculator__title {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #0065DA;
    }

    .custom-treatments-payment-calculator__description {
      margin-bottom: 20px;
      font-size: 1rem;
      line-height: 1.4;
      max-width: 800px;
    }

    .custom-treatments-payment-calculator__slider {
      margin: 20px 0;
    }

    .custom-treatments-payment-calculator__slider label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .custom-treatments-payment-calculator__slider input[type="range"] {
      width: 100%;
      max-width: 800px;
    }

    .custom-treatments-payment-calculator input[type="number"] {
      width: 100px;
      margin-left: 6px;
      padding: 4px;
      font-size: 0.95rem;
    }

    .custom-treatments-payment-calculator__result {
      margin-top: 30px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .custom-treatments-payment-calculator__amount {
      color: #e54b2c;
    }

    .custom-treatments-payment-calculator__benefit-buttons {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .custom-treatments-payment-calculator__benefit-buttons button {
      background-color: #fff;
      border: 2px solid #e54b2c;
      color: #e54b2c;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .custom-treatments-payment-calculator__benefit-buttons button:hover {
      background-color: #e54b2c;
      color: #fff;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="custom-treatments-payment-calculator" id="calculator">
    <h2 class="custom-treatments-payment-calculator__title">Payment Calculator</h2>
    <p class="custom-treatments-payment-calculator__description">
      Estimate your treatment cost with flexible payment options and no-interest financing.
    </p>

    <!-- Treatment Cost -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Treatment Cost: $
        <input type="number" id="treatmentCostInput" min="1000" max="6000" step="100" value="5500">
      </label>
      <input type="range" id="treatmentCost" min="1000" max="6000" step="100" value="5500">
    </div>

    <!-- Appliance Fees (NEW) -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Appliance Fees: $
        <input type="number" id="applianceFeesInput" min="0" max="3000" step="50" value="0">
      </label>
      <input type="range" id="applianceFees" min="0" max="3000" step="50" value="0">
    </div>

    <!-- Initial Payment -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Initial Payment: $
        <input type="number" id="initialPaymentInput" min="0" max="5000" step="100" value="3000">
      </label>
      <input type="range" id="initialPayment" min="0" max="5000" step="100" value="3000">
    </div>

    <!-- Term Length -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Term Length:
        <input type="number" id="termLengthInput" min="1" max="36" step="1" value="11">
        months
      </label>
      <input type="range" id="termLength" min="1" max="36" step="1" value="11">
    </div>

    <!-- Monthly Payment -->
    <div class="custom-treatments-payment-calculator__result">
      Monthly Payment:
      <span class="custom-treatments-payment-calculator__amount" id="monthlyPayment">$0.00 / month</span>
    </div>
  </div>

  <script>
    const el = id => document.getElementById(id);

    const elements = {
      treatmentCost: el("treatmentCost"),
      treatmentCostInput: el("treatmentCostInput"),
      applianceFees: el("applianceFees"),
      applianceFeesInput: el("applianceFeesInput"),
      initialPayment: el("initialPayment"),
      initialPaymentInput: el("initialPaymentInput"),
      termLength: el("termLength"),
      termLengthInput: el("termLengthInput"),
      monthlyPayment: el("monthlyPayment")
    };

    const clamp = (v,min,max)=>Math.min(Math.max(v,min),max);

    function syncRangeToInput(range,input){ input.value = range.value; }
    function syncInputToRange(input,range){
      input.value = clamp(input.value, range.min, range.max);
      range.value = input.value;
    }

    function calculatePayment(){
      const treatment = +elements.treatmentCost.value;
      const appliance = +elements.applianceFees.value;
      const down = +elements.initialPayment.value;
      const months = +elements.termLength.value;

      const total = treatment + appliance;
      const net = total - down;
      const monthly = months>0 ? Math.max(net/months,0) : 0;

      elements.monthlyPayment.textContent = `$${monthly.toFixed(2)} / month`;
    }

    // Range → Input
    ["treatmentCost","applianceFees","initialPayment","termLength"].forEach(id=>{
      elements[id].addEventListener("input",()=>{
        syncRangeToInput(elements[id], elements[id+"Input"]);
        calculatePayment();
      });
    });

    // Input → Range
    ["treatmentCost","applianceFees","initialPayment","termLength"].forEach(id=>{
      elements[id+"Input"].addEventListener("input",()=>{
        syncInputToRange(elements[id+"Input"], elements[id]);
        calculatePayment();
      });
    });

    calculatePayment();
  </script>
</body>
</html>
