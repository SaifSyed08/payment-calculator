<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treatment Payment Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <style>
    .custom-treatments-payment-calculator {
      border-top: 1px solid #ccc;
      margin: 30px 0;
      padding: 20px;
      font-family: "Outfit", sans-serif;
    }

    .custom-treatments-payment-calculator__title {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #0065DA;
    }

    .custom-treatments-payment-calculator__description {
      margin-bottom: 20px;
      font-size: 1rem;
      line-height: 1.4;
      max-width: 800px;
    }

    .custom-treatments-payment-calculator__slider {
      margin: 20px 0;
    }

    .custom-treatments-payment-calculator__slider label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .custom-treatments-payment-calculator__slider input[type="range"] {
      width: 100%;
      max-width: 800px;
    }

    .custom-treatments-payment-calculator input[type="number"] {
      width: 100px;
      margin-left: 6px;
      padding: 4px;
      font-size: 0.95rem;
    }

    .custom-treatments-payment-calculator__result {
      margin-top: 30px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .custom-treatments-payment-calculator__amount {
      color: #e54b2c;
    }

    .custom-treatments-payment-calculator__benefit-buttons {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Bigger Buttons */
    .custom-treatments-payment-calculator__benefit-buttons button {
      background-color: #fff;
      border: 2px solid #e54b2c;
      color: #e54b2c;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      border-radius: 6px;
    }

    .custom-treatments-payment-calculator__benefit-buttons button:hover {
      background-color: #e54b2c;
      color: #fff;
    }

    button, input, label, span, div, h2, p {
      font-family: 'Outfit', sans-serif !important;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="custom-treatments-payment-calculator" id="calculator">
    <h2 class="custom-treatments-payment-calculator__title">Payment Calculator</h2>
    <p class="custom-treatments-payment-calculator__description">
      Would you like to estimate your treatment cost? We offer flexible payment options
      including low down payments and no-interest financing. Try our payment calculator
      to find a plan right for you.
    </p>

    <!-- Treatment Cost -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Treatment Cost: $
        <input type="number" id="treatmentCostInput" min="0" max="6000" step="100" value="5500">
      </label>
      <input type="range" id="treatmentCost" min="0" max="6000" step="100" value="5500">
    </div>

    <!-- Appliance Fees -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Appliance Fees: $
        <input type="number" id="applianceFeesInput" min="0" max="3000" step="50" value="0">
      </label>
      <input type="range" id="applianceFees" min="0" max="3000" step="50" value="0">
    </div>

    <!-- Initial Payment -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Initial Payment: $
        <input type="number" id="initialPaymentInput" min="0" max="5000" step="100" value="3000">
      </label>
      <input type="range" id="initialPayment" min="0" max="5000" step="100" value="3000">
    </div>

    <!-- Term Length -->
    <div class="custom-treatments-payment-calculator__slider">
      <label>
        Term Length:
        <input type="number" id="termLengthInput" min="0" max="36" step="1" value="11">
        months
      </label>
      <input type="range" id="termLength" min="0" max="36" step="1" value="11">
    </div>

    <!-- Insurance Benefit (Always Visible) -->
    <div class="custom-treatments-payment-calculator__slider" id="insuranceSlider">
      <label>
        Insurance Benefit: $
        <input type="number" id="insuranceValueInput" min="0" max="3000" step="100" value="500">
      </label>
      <input type="range" id="insuranceValue" min="0" max="3000" step="100" value="500">
    </div>

    <!-- Promotion Benefit (Toggle) -->
    <div class="custom-treatments-payment-calculator__slider hidden" id="promotionSlider">
      <label>
        Promotion Benefit: $
        <input type="number" id="promotionValueInput" min="0" max="2000" step="100" value="250">
      </label>
      <input type="range" id="promotionValue" min="0" max="2000" step="100" value="250">
    </div>

    <!-- Monthly Payment -->
    <div class="custom-treatments-payment-calculator__result">
      Monthly Payment:
      <span class="custom-treatments-payment-calculator__amount" id="monthlyPayment">$0.00 / month</span>
    </div>

    <!-- Buttons -->
    <div class="custom-treatments-payment-calculator__benefit-buttons">
      <button id="togglePromotion">Add Promotion Benefit</button>
    </div>
  </div>

  <script>
    const elements = {
      treatmentCost: document.getElementById("treatmentCost"),
      treatmentCostInput: document.getElementById("treatmentCostInput"),

      applianceFees: document.getElementById("applianceFees"),
      applianceFeesInput: document.getElementById("applianceFeesInput"),

      initialPayment: document.getElementById("initialPayment"),
      initialPaymentInput: document.getElementById("initialPaymentInput"),

      termLength: document.getElementById("termLength"),
      termLengthInput: document.getElementById("termLengthInput"),

      insuranceValue: document.getElementById("insuranceValue"),
      insuranceValueInput: document.getElementById("insuranceValueInput"),

      promotionValue: document.getElementById("promotionValue"),
      promotionValueInput: document.getElementById("promotionValueInput"),

      promotionSlider: document.getElementById("promotionSlider"),
      togglePromotion: document.getElementById("togglePromotion"),
      monthlyPayment: document.getElementById("monthlyPayment")
    };

    let showPromotion = false;

    function clamp(value, min, max) {
      const num = parseFloat(value);
      if (isNaN(num)) return min;
      return Math.min(Math.max(num, min), max);
    }

    function syncRangeToInput(range, input) {
      input.value = range.value;
    }

    function syncInputToRange(input, range) {
      const min = parseFloat(range.min);
      const max = parseFloat(range.max);
      input.value = clamp(input.value, min, max);
      range.value = input.value;
    }

    function calculatePayment() {
      const treatmentCost = parseFloat(elements.treatmentCost.value) || 0;
      const applianceFees = parseFloat(elements.applianceFees.value) || 0;
      const initialPayment = parseFloat(elements.initialPayment.value) || 0;
      const termLength = parseInt(elements.termLength.value) || 0;
      const insuranceValue = parseFloat(elements.insuranceValue.value) || 0;
      const promotionValue = showPromotion ? (parseFloat(elements.promotionValue.value) || 0) : 0;

      const totalCost = treatmentCost + applianceFees;
      const netCost = totalCost - initialPayment - insuranceValue - promotionValue;
      const monthly = termLength > 0 ? Math.max(netCost / termLength, 0) : 0;

      elements.monthlyPayment.textContent = `$${monthly.toFixed(2)} / month`;
    }

    // Range → Input
    Object.entries(elements).forEach(([key, el]) => {
      if (el && el.type === "range") {
        el.addEventListener("input", () => {
          syncRangeToInput(el, elements[key + "Input"]);
          calculatePayment();
        });
      }
    });

    // Input → Range
    Object.entries(elements).forEach(([key, el]) => {
      if (el && el.type === "number") {
        el.addEventListener("input", () => {
          syncInputToRange(el, elements[key.replace("Input","")]);
          calculatePayment();
        });
      }
    });

    elements.togglePromotion.addEventListener("click", () => {
      showPromotion = !showPromotion;
      elements.promotionSlider.classList.toggle("hidden", !showPromotion);
      elements.togglePromotion.textContent = showPromotion
        ? "Remove Promotion Benefit"
        : "Add Promotion Benefit";
      calculatePayment();
    });

    calculatePayment();
  </script>
</body>
</html>
